# Silent Hill: Homecoming (Xbox 360), "Build v18.51" (Code Changelist #437812).
[project]
name = "shh"
sdk_version = "0.10.0"
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here
# overrides what is included.
#
#   overrides.toml  written by hand: specific findings, each with its explanation
#   huecos.toml     generated by tools/huecos.py: code gaps of >= 8 bytes
includes = ["overrides.toml", "huecos.toml"]
