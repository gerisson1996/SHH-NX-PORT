# Publishes release/shh.nro as the release named by release/VERSION (for example 1.1 -> tag v1.1): the NRO, and a zip
# with the SD card's layout (the NRO and, when release/deko3d_shaders.bin is there, the prebuilt shader cache), with the
# notes in .github/release-v<VERSION>.md. Runs when one of them or this file is pushed to main; an existing release of
# that version gets its files and notes replaced.
name: Release

on:
  push:
    branches: [main]
    paths:
      - release/shh.nro
      - release/deko3d_shaders.bin
      - release/VERSION
      - .github/release-v*.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f release/shh.nro ]; then
            echo "release/shh.nro is not in the repository: nothing to publish"
            exit 0
          fi
          VER=1.0
          if [ -f release/VERSION ]; then
            VER=$(tr -d ' \r\n' < release/VERSION)
          fi
          TAG="v$VER"
          NOTES=".github/release-v$VER.md"
          ZIP="SHH-NX-V$VER.zip"
          TITLE="Silent Hill Homecoming NX - V$VER"
          mkdir -p pkg/switch/shh-nx
          cp release/shh.nro pkg/switch/shh-nx/shh.nro
          if [ -f release/deko3d_shaders.bin ]; then
            cp release/deko3d_shaders.bin pkg/switch/shh-nx/deko3d_shaders.bin
          fi
          (cd pkg && zip -9 -r "../$ZIP" switch)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/shh.nro "$ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" release/shh.nro "$ZIP" --target "$GITHUB_SHA" --latest \
              --title "$TITLE" --notes-file "$NOTES"
          fi
